apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: local-vault-test

# Local-only smoke test: runs on a self-hosted edge runner (docker mode,
# Colima) against a Vault dev container on the same Docker daemon.
#   Vault:  docker run -d --name vault-local -p 8200:8200 vault:1.7.3 \
#             server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
#   Seed:   KV v1 mount "kv1", secret kv1/app/demo {username, password}
#   Image:  hashicorp-vault-actions:local, built from this repo on busybox
#           (non-latest tag, so the runner uses the local image, no pull)
# 172.17.0.1 is the docker0 bridge IP inside the Colima VM, where the
# published port 8200 listens.

on:
  workflow_dispatch:

jobs:
  fetch-kv1:
    runs-on: [self-hosted, nagesh]
    steps:
      - id: fetch
        name: Fetch KV v1 secret
        uses: cloudbees-io/hashicorp-vault-fetch-secrets@v1
        with:
          url: http://172.17.0.1:8200
          method: token
          token: root
          secrets: |
            kv1/app/demo username | demo_user;
            kv1/app/demo password | demo_password

      - name: Check output
        uses: docker://busybox:1.38.0
        shell: sh
        env:
          VAULT_OUTPUT: ${{ steps.fetch.outputs.vault_output_var }}
        run: |
          set -eu
          echo "vault_output (values masked in logs): $VAULT_OUTPUT"
          echo "$VAULT_OUTPUT" | grep -q '"demo_user":"demo_user"'
          echo "$VAULT_OUTPUT" | grep -q '"demo_password":"hello-from-v1"'
          echo "PASS"
