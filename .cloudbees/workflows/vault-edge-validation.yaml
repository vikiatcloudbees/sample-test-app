apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: vault-edge-validation

# THROWAWAY (CBP-72654): validates the Vault fetch-secrets action on a local edge runner
# (label edge-vkumar). Not to be merged. The community job is
# omitted because edge runners reject `services:`.
#
# Secret properties: VAULT_ENTERPRISE_URL, VAULT_ENTERPRISE_NAMESPACE,
# VAULT_ENTERPRISE_ROLE_ID, VAULT_ENTERPRISE_SECRET_ID (multi-use).

on:
  workflow_dispatch:

permissions:
  scm-token-own: read
  scm-token-org: read

jobs:
  # Runs against a pre-provisioned Vault Enterprise instance using only AppRole
  # credentials (no admin token, no seeding): the secret to read must already
  # exist and be readable by that role. Token auth is covered by logging in with
  # the AppRole to get a client token and passing it to the action (the action
  # revokes that token afterwards). If the secret-id is single-use, the second
  # login (the AppRole step) will fail - use a multi-use secret-id.
  enterprise:
    runs-on: [self-hosted, nagesh]
    steps:

      - id: fetch-my-secrets
        name: "Enterprise: AppRole auth in namespace"
        uses: cloudbees-io/hashicorp-vault-fetch-secrets@main
        with:
          url: ${{ secrets.VAULT_ENTERPRISE_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ENTERPRISE_ROLE_ID }}
          secretId: ${{ secrets.VAULT_ENTERPRISE_SECRET_ID }}
          namespace: ${{ secrets.VAULT_ENTERPRISE_NAMESPACE }}
          secrets: |
            secret/data/app/prod/db password | vault_output




      - name: Use fetched secrets
        uses: docker://golang:1.26.3
        shell: sh
        run: |
          echo "approle output: $APPROLE_OUTPUT"
          echo "DB password is fetched but masked: ${{ fromJSON(steps.fetch-my-secrets.outputs.vault_output).password }}"





